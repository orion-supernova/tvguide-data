name: Update TV guide

on:
  schedule:
    - cron: '17 */4 * * *' # every 4 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # iptv-org/epg grabbers (community-maintained site parsers), pinned for reproducible builds
  EPG_REPO: iptv-org/epg
  EPG_SHA: 6a74973f1e0657184bf168e589a043ac66bac551

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EPG_REPO }}
          ref: ${{ env.EPG_SHA }}
          path: epg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: epg/package-lock.json
      - name: Install iptv-org/epg
        working-directory: epg
        run: npm ci --no-audit --no-fund
        continue-on-error: true # countries that use it are skipped; the rest still deploy
      - name: Fetch Digiturk relay (pushed from a home connection)
        run: |
          mkdir -p relay
          git fetch --depth 1 origin relay && git show FETCH_HEAD:digiturk.json > relay/digiturk.json || echo "no relay branch yet"
      - name: Build Turkey
        run: node build.mjs || { echo "::warning::Turkey build failed — leaving it out"; rm -rf out/tr; }
      - name: Build other countries
        env:
          EPG_DIR: ${{ github.workspace }}/epg
          # fill what a source no longer serves (e.g. Sky Italia has no past days) from the live site
          PREVIOUS_URL: https://orion-supernova.github.io/tvguide-data
        run: node build-intl.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Logo background hints (logoBg)
        run: |
          pip install --quiet pillow==11.0.0
          python3 tools/logo-tones.py out
        continue-on-error: true # without it channels keep the cached hints from logos/tones.json
      - name: Check output
        run: |
          cat out/countries.json
          du -sh out; ls out
          test -s out/countries.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Separate job: deploy-pages sometimes can't see an artifact uploaded a second earlier
  # in the same job ("No artifacts named github-pages were found"), so retry once after a pause.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
